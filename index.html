<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 安定版 - 3Dモデル全方向タッチ操作</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>

  <!-- A-Frame & MindAR (基本構造通り) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- 画面左上の状態確認表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">準備中...</span></div>
  </div>

  <!-- 参考コードと同じシンプルで最も安定した a-scene 構造 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカー認識ターゲット (targetIndex: 0) -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 家の3Dモデル -->
      <a-gltf-model 
        id="houseMesh" 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const houseMesh = document.querySelector('#houseMesh');

    // 1. MindARの起動イベント判定
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！マーカーをかざしてください";
      statusEl.className = "success";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    // 2. マーカー認識・離脱イベント
    const targetEntity = document.querySelector('#targetEntity');
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = '認識成功！(1本指:全方向回転 / 2本指:拡大縮小)';
      statusEl.className = 'success';
    });

    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカーを検索中...';
      statusEl.className = '';
    });

    // 3. 安全なタッチ操作（縦横全方向スワイプ ＆ ピンチ拡大縮小）
    let startX = null;
    let startY = null;
    let currentRotX = 0;
    let currentRotY = 0;
    let initialDistance = null;
    let initialScale = 0.25;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (houseMesh) {
          const s = houseMesh.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!houseMesh) return;

      if (e.touches.length === 1 && startX !== null && startY !== null) {
        // 1本指スワイプ：上下移動でX軸(縦)回転、左右移動でY軸(横)回転
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;

        currentRotY += deltaX * 0.5;
        currentRotX += deltaY * 0.5;

        houseMesh.setAttribute('rotation', `${currentRotX} ${currentRotY} 0`);

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        // 2本指ピンチ：拡大縮小
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.05, Math.min(2.0, initialScale * factor));
        houseMesh.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      startX = null;
      startY = null;
      initialDistance = null;
    });
  </script>
</body>
</html>
